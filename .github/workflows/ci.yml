name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci_only_password   # throw-away service container, CI only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci_only_password --silent"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      TEST_MYSQL_URL: jdbc:mysql://127.0.0.1:3306/events_test?createDatabaseIfNotExist=true
      TEST_MYSQL_PASSWORD: ci_only_password
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build, test and enforce the 100% gate (domain + application)
        run: mvn -B verify
      - name: Coverage summary
        if: always()
        run: sh scripts/coverage-summary.sh | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: jacoco-reports
          path: "*/target/site/jacoco"

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t java-spring-clean-events .

spring.application.name=events
# Overridden by SPRING_DATASOURCE_* in docker-compose. Default points at `make up-db` (dev-only password).
spring.datasource.url=jdbc:mysql://localhost:3316/events?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=dev_only_root_password

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jackson.default-property-inclusion=non_null

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

springdoc.swagger-ui.path=/swagger-ui.html

# Integration tests need a real MySQL. Defaults match `make up-db` (docker-compose.yml, dev-only password).
spring.datasource.url=${TEST_MYSQL_URL:jdbc:mysql://127.0.0.1:3316/events_test?createDatabaseIfNotExist=true}
spring.datasource.username=${TEST_MYSQL_USER:root}
spring.datasource.password=${TEST_MYSQL_PASSWORD:dev_only_root_password}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.clean-disabled=false
